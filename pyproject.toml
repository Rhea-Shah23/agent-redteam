[project]
name = "agent-redteam"
version = "0.1.0"
description = "Red team harness for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redteam"]

[tool.setuptools.package-data]
redteam = ["fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
